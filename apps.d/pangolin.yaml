# Реестр приложения (docs/databases.md). Декларация без секретов:
# Пароли генерируются на нодах в /etc/db/secrets/ (umask 077) — в гит не попадают.
name: pangolin
engine: pg              # pg | mongo
class: cluster          # cluster | local (БД живёт только на своей ноде, без репликации)
placement: [a, b, c]    # S(X): где живёт приложение = где живут его БД
primary: b              # стартовый первичный; дальше назначает db-guard
port: 5432              # порт приложения на VIP 10.66.0.99 (реестр = диспетчер портов)

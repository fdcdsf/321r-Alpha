# Zabbix 7.0 LTS native HA: server на control + standby (один ACTIVE).
# Web на ВСЕХ нодах: локальная цель Pangolin доступна при потере любого VPS.
name: zabbix
services:
  server:
    image: docker.io/zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    init: true
    mem_limit: 768m
    env_file: .env
    environment:
      DB_SERVER_HOST: 10.66.0.99
      DB_SERVER_PORT: 5434
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      ZBX_CACHESIZE: 64M
      ZBX_HISTORYCACHESIZE: 16M
      ZBX_STARTPOLLERS: 5
      ZBX_STARTPINGERS: 1
      ZBX_STARTDISCOVERERS: 1
      ZBX_HANODENAME: 'zbx-__NODE__'
      ZBX_NODEADDRESS: '__MESH_IP__:10051'
    ports:
      - '__MESH_IP__:10051:10051'
    volumes:
      # Алерты в тот же Telegram-бот 321r. Токен — только /etc/db/secrets,
      # в БД Zabbix он не попадает: relay читает смонтированный секрет.
      - /opt/zabbix/tg-relay.sh:/usr/lib/zabbix/alertscripts/tg-relay.sh:ro
      - /etc/db/secrets/zabbix-telegram.env:/run/secrets/zabbix-telegram.env:ro
    healthcheck:
      test: ["CMD-SHELL", "zabbix_server -V >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    image: docker.io/zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      DB_SERVER_HOST: 10.66.0.99
      DB_SERVER_PORT: 5434
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      # Не задавать ZBX_SERVER_HOST: frontend сам находит ACTIVE через nodes DB.
      PHP_TZ: UTC
    ports:
      - '127.0.0.1:8081:8080'
    networks:
      - default
      - pangolin

networks:
  pangolin:
    name: pangolin
    external: true

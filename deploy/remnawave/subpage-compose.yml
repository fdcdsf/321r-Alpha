# Subscription Page (docs.rw/install/subscription-page/bundled) — адаптация 321r:
# доступ через ресурс Pangolin sub.321r.ru (cluster-b -> 127.0.0.1:3010).
services:
  remnawave-subscription-page:
    image: remnawave/subscription-page:latest
    container_name: remnawave-subscription-page
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
    mem_limit: 256m
    hostname: remnawave-subscription-page
    restart: always
    env_file:
      - .env
    ports:
      - '127.0.0.1:3010:3010'
    networks:
      - remnawave-network

networks:
  remnawave-network:
    driver: bridge
    external: true

# Health-check подкладка для Subscription Page: приложение требует X-Forwarded-*
# (ProxyCheckMiddleware убивает прямые запросы), а HC Pangolin не шлёт заголовки.
server {
    listen 127.0.0.1:3011;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host sub.321r.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host sub.321r.ru;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

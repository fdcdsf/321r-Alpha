# Локальный HC адаптер Remnawave для Pangolin Newt.
# Панель требует X-Forwarded-*; прямой HC к 127.0.0.1:3000 получает пустой ответ.
server {
    listen 127.0.0.1:3012;
    server_name _;
    location = / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host rem.__DOMAIN__;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For 127.0.0.1;
    }
}

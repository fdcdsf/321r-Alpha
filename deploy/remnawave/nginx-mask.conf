server {
    listen 0.0.0.0:9447;
    server_name _;
    root /var/www/mask;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 0.0.0.0:8448 ssl;
    server_name tg.321r.ru;
    ssl_certificate     /etc/letsencrypt/live/mask/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mask/privkey.pem;
    root /var/www/mask;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
